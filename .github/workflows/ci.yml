name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: dev
  PLT_DIR: priv/plts

jobs:
  test:
    name: Test and dialyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Restore dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test

      # The PLT takes minutes to build from scratch and only changes when the
      # toolchain or the dependencies do, so it is cached on its own key.
      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt
        with:
          path: ${{ env.PLT_DIR }}
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Build PLT
        if: steps.plt.outputs.cache-hit != 'true'
        run: mkdir -p "$PLT_DIR" && mix dialyzer --plt

      - name: Run dialyzer
        run: mix dialyzer --format github

      # Excluded from the default `mix test` run because it needs the PLT above.
      - name: Check dialyzer still sees through the generated code
        run: mix test --only dialyzer
